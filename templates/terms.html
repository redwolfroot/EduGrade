<!DOCTYPE html>
<html lang="de" data-title-de="Nutzungsbedingungen - EduGrade" data-title-en="Terms of Service - EduGrade">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Referrer-Policy" content="strict-origin-when-cross-origin">
    <title>Terms of Service - EduGrade</title>
    <link rel="icon" type="image/svg+xml" href="/static/logo.svg?v={{ app_version }}">
    <link rel="manifest" href="/static/manifest.json?v={{ app_version }}">
    <meta name="theme-color" content="#0B0B0B">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="EduGrade">
    <link rel="apple-touch-icon" href="/static/icons/icon-192.png?v={{ app_version }}">
    <script src="/static/scripts/resource-guard.js?v={{ app_version }}"></script>
    <script src="/static/scripts/domain-move.js?v={{ app_version }}"></script>
    <script src="/static/vendor/tailwind-browser.js"></script>
    <link rel="stylesheet" href="/static/vendor/basecoat.min.css">
    <link rel="stylesheet" href="/static/css/style.css?v={{ app_version }}">
    <link rel="stylesheet" href="/static/css/avocloud-branding.css?v={{ app_version }}">
    <script src="/static/scripts/legal-lang.js?v={{ app_version }}"></script>
    <script src="/static/scripts/theme.js?v={{ app_version }}"></script>
    <style>
        html,
        body {
            overflow: visible !important;
            overflow-y: scroll !important;
            height: auto !important;
            min-height: 100% !important;
            overscroll-behavior: auto !important;
        }

        #app {
            overflow: visible !important;
        }

        .hero-gradient {
            background: linear-gradient(135deg, oklch(.3 .1 250) 0%, oklch(.2 .05 280) 100%);
        }

        .section-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 2rem;
            height: 2rem;
            border-radius: 0.5rem;
            background: oklch(.3 .1 250);
            color: white;
            font-weight: 600;
            font-size: 0.875rem;
            margin-right: 0.75rem;
            flex-shrink: 0;
        }
        .pp p, .pp li { color: oklch(.708 0 0); }
        .pp ul { list-style: disc; padding-left: 1.25rem; }
        .pp li { margin-top: 0.35rem; }
        .pp h4 { font-weight: 600; margin-top: 1rem; margin-bottom: 0.25rem; }
        .pp a { color: rgb(96 165 250); }
        .pp a:hover { text-decoration: underline; }
    </style>
</head>

<body>
    <div id="app" class="mx-auto px-4 sm:px-10 lg:px-16 py-6" style="max-width: 60rem;">
        <header class="flex items-center justify-between gap-2 mb-8">
            <a href="/" class="btn-outline flex items-center gap-2">
                <svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 18l-6-6 6-6" />
                </svg>
                <span data-lang-inline="de">Zurück zur App</span><span data-lang-inline="en">Back to app</span>
            </a>
            <div class="legal-lang-switch" role="group" aria-label="Language"><button type="button" data-set-lang="de">DE</button><button type="button" data-set-lang="en">EN</button></div>
        </header>

        <div data-lang-block="de">
{% include '_terms_de.html' %}
        </div>
        <div data-lang-block="en">
{% include '_terms_en.html' %}
        </div>

{% include '_legal_footer.html' %}
    </div>
    <script src="/static/scripts/avocloud-logo.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/service-worker.js', { scope: '/' });
    }
    </script>
</body>

</html>
